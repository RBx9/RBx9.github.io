name: Build RBx9 Source Manager IPA

on:
  push:
    branches: [main]
    paths:
      - 'source-manager/**'
      - '.github/workflows/build-source-manager.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rbx9-source-manager-v1-2
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Draw bundled RBx9 app icon
        run: swift source-manager/scripts/create_icon.swift
      - name: Generate Xcode project
        run: |
          cd source-manager
          xcodegen generate
      - name: Build unsigned iPhone/iPad application
        run: |
          set -euo pipefail
          xcodebuild -project source-manager/RBx9SourceManager.xcodeproj \
            -scheme RBx9SourceManager -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SourceManagerBuild" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test IPA dylib packaging before publishing the manager
        run: |
          set -euo pipefail
          python3 -m pip install --user "lief==0.17.1"
          echo 'int rbx9_source_manager_test(void) { return 9; }' > "$RUNNER_TEMP/test-dylib.c"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 \
            -dynamiclib -o "$RUNNER_TEMP/RBx9Test.dylib" "$RUNNER_TEMP/test-dylib.c"
          app="$RUNNER_TEMP/SourceManagerBuild/Build/Products/Release-iphoneos/RBx9SourceManager.app"
          mkdir -p "$RUNNER_TEMP/test-payload/Payload"
          cp -R "$app" "$RUNNER_TEMP/test-payload/Payload/"
          (cd "$RUNNER_TEMP/test-payload" && /usr/bin/zip -qry "$RUNNER_TEMP/test-original.ipa" Payload)
          python3 source-manager/scripts/prepare_injected_ipa.py \
            --ipa "$RUNNER_TEMP/test-original.ipa" \
            --library "$RUNNER_TEMP/RBx9Test.dylib" \
            --output "$RUNNER_TEMP/test-injected.ipa"
          unzip -tq "$RUNNER_TEMP/test-injected.ipa"
      - name: Package IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SourceManagerBuild/Build/Products/Release-iphoneos/RBx9SourceManager.app"
          test -f "$app/RBx9SourceManager"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/RBx9SourceManager-v1.2.0-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/RBx9SourceManager-v1.2.0-unsigned.ipa"
      - name: Publish unsigned IPA in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rbx9-source-manager-v1.2.0"
          asset="RBx9SourceManager-v1.2.0-unsigned.ipa"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title "RBx9 Source Manager v1.2.0 (Unsigned IPA)" \
              --notes "Native Files picker, multi-dylib selection and verified GitHub Actions IPA packaging, plus ESign and Sileo source management. Unsigned IPA, sign with your certificate."
          fi
