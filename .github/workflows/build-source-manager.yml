name: Build RBx9 Source Manager IPA

on:
  push:
    branches: [main]
    paths:
      - 'source-manager/**'
      - '.github/workflows/build-source-manager.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rbx9-source-manager-v1-2
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Draw bundled RBx9 app icon
        run: swift source-manager/scripts/create_icon.swift
      - name: Generate Xcode project
        run: |
          cd source-manager
          xcodegen generate
      - name: Build unsigned iPhone/iPad application
        run: |
          set -euo pipefail
          xcodebuild -project source-manager/RBx9SourceManager.xcodeproj \
            -scheme RBx9SourceManager -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SourceManagerBuild" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Build a sample iOS library for injection test
        run: |
          set -euo pipefail
          echo 'int rbx9_source_manager_test(void) { return 9; }' > "$RUNNER_TEMP/test-dylib.c"
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=16.0 \
            -dynamiclib -o "$GITHUB_WORKSPACE/RBx9Test.dylib" "$RUNNER_TEMP/test-dylib.c"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/SourceManagerBuild/Build/Products/Release-iphoneos/RBx9SourceManager.app"
          test -f "$app/RBx9SourceManager"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/RBx9SourceManager-v1.2.0-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: manager-with-test-dylib
          path: |
            RBx9SourceManager-v1.2.0-unsigned.ipa
            RBx9Test.dylib
          if-no-files-found: error
          retention-days: 3

  test-and-publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: manager-with-test-dylib
          path: ${{ runner.temp }}/rbx9-build
      - name: Install injection tooling
        run: python -m pip install 'lief==0.17.6'
      - name: Test IPA dylib injection and verify archive
        run: |
          set -euo pipefail
          python source-manager/scripts/prepare_injected_ipa.py \
            --ipa "$RUNNER_TEMP/rbx9-build/RBx9SourceManager-v1.2.0-unsigned.ipa" \
            --library "$RUNNER_TEMP/rbx9-build/RBx9Test.dylib" \
            --output "$RUNNER_TEMP/rbx9-test-injected.ipa"
          unzip -tq "$RUNNER_TEMP/rbx9-test-injected.ipa"
          test -s "$RUNNER_TEMP/rbx9-test-injected.ipa"
      - name: Publish tested Source Manager IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="rbx9-source-manager-v1.2.0"
          asset="$RUNNER_TEMP/rbx9-build/RBx9SourceManager-v1.2.0-unsigned.ipa"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" \
              --title "RBx9 Source Manager v1.2.0 (Unsigned IPA)" \
              --notes "IPA and DEB Files selection, ESign and Sileo source management, and multi-dylib IPA injection via GitHub Actions with verification. The resulting IPA is unsigned and must be signed before installation."
          fi
