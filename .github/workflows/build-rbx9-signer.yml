name: RBx9 Signer iOS 16+ Build

on:
  push:
    branches: [fix/rbx9-signer-installer-diagnostics-private-1-3-19]
    paths:
      - 'rbx9-signer/**'
      - '.github/workflows/build-rbx9-signer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rbx9-signer-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rbx9:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - name: Checkout isolated RBx9 build branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch Feather GPL-3.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/claration/feather.git feather
          test -f feather/LICENSE
          test -f feather/Feather.xcodeproj/project.pbxproj

      - name: Prepare selected RBx9 icon
        shell: bash
        run: |
          set -euo pipefail
          test -f rbx9-signer/icon-base64.txt
          base64 -D -i rbx9-signer/icon-base64.txt -o rbx9-source-icon.jpg
          sips -s format png rbx9-source-icon.jpg --out rbx9-source-icon.png
          sips -z 1024 1024 rbx9-source-icon.png
          sips -g pixelWidth -g pixelHeight rbx9-source-icon.png

      - name: Generate six optional RBx9 icon designs
        shell: bash
        run: |
          set -euo pipefail
          swift rbx9-signer/make_alternates.swift rbx9-source-icon.png rbx9-alt-icons
          test "$(find rbx9-alt-icons -type f -name '*.png' | wc -l | tr -d ' ')" = 12
          # Original primary icon is left untouched.

      - name: Apply RBx9 customizations
        shell: bash
        run: |
          set -euo pipefail
          python3 rbx9-signer/bootstrap.py
          python3 rbx9-signer/upgrade_v1_1.py
          python3 rbx9-signer/upgrade_icons_appearance.py
          python3 rbx9-signer/upgrade_v1_2.py
          python3 rbx9-signer/hotfix_v1_2_1.py
          python3 rbx9-signer/upgrade_v1_3.py
          python3 rbx9-signer/upgrade_v1_3_1.py
          python3 rbx9-signer/upgrade_v1_3_2.py
          python3 rbx9-signer/upgrade_v1_3_3.py
          python3 rbx9-signer/upgrade_v1_3_4.py
          python3 rbx9-signer/upgrade_v1_3_5.py
          python3 rbx9-signer/upgrade_v1_3_6.py
          python3 rbx9-signer/upgrade_v1_3_7.py
          python3 rbx9-signer/upgrade_v1_3_8.py
          python3 rbx9-signer/upgrade_v1_3_9.py
          # Remove the separate SwiftUI animation, then substitute RBx9
          # in Feather's original iOS system launch storyboard.
          python3 rbx9-signer/upgrade_v1_3_10.py
          python3 rbx9-signer/upgrade_v1_3_11.py
          python3 rbx9-signer/upgrade_v1_3_12.py
          python3 rbx9-signer/upgrade_v1_3_13.py
          python3 rbx9-signer/upgrade_v1_3_14.py
          python3 rbx9-signer/upgrade_v1_3_15.py
          python3 rbx9-signer/upgrade_v1_3_16.py
          python3 rbx9-signer/upgrade_v1_3_17.py
          python3 rbx9-signer/upgrade_v1_3_18.py
          python3 rbx9-signer/upgrade_v1_3_19.py
          python3 rbx9-signer/upgrade_v1_3_19_installer_diagnostics.py
          python3 rbx9-signer/upgrade_v1_3_19_delete_hardening.py
          python3 rbx9-signer/upgrade_v1_3_20.py
          python3 rbx9-signer/upgrade_v1_3_21.py
          python3 rbx9-signer/upgrade_v1_3_22.py
          python3 rbx9-signer/upgrade_v1_3_23.py
          python3 rbx9-signer/upgrade_v1_3_23_stages.py
          grep -F 'Label("Retry Install"' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'Task.sleep(nanoseconds: 9_000_000_000)' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'recoveryExpanded: $rbx9RecoveryExpanded' feather/Feather/Views/Library/LibraryView.swift
          grep -F 'height(rbx9RecoveryExpanded ? 440 : 200)' feather/Feather/Views/Library/LibraryView.swift
          grep -F 'Label("Web Installer"' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'rbx9CheckLocalServer' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'URLSessionConfiguration.background' feather/Feather/Backend/Observable/DownloadManager.swift
          grep -F 'handleEventsForBackgroundURLSession' feather/Feather/FeatherApp.swift
          grep -F '_rbx9SigningMode' feather/Feather/Views/Signing/SigningView.swift
          grep -F '_rbx9IsClientDisconnect' feather/Feather/Backend/Server/ServerInstaller.swift
          grep -F 'rbx9WebFallbackTask' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F '_rbx9IsFatMachO' feather/Feather/Utilities/Handlers/SigningHandler.swift
          grep -F 'invalidDylib' feather/Feather/Utilities/Handlers/TweakHandler.swift
          grep -F 'self._server = try setupApp' feather/Feather/Backend/Server/ServerInstaller.swift
          grep -F 'RBx9DeleteTweakSheet' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'confirmedDeletionAfterDismiss' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'allowsFullSwipe: false' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'Text("Downloaded")' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F '.searchable(text: $searchText' feather/Feather/Views/Signing/SigningTweaksView.swift
          ! grep -Fq '"Delete stored file?"' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'case dylibs' feather/Feather/Views/TabView/TabEnum.swift
          grep -F '.dylibs,' feather/Feather/Views/TabView/TabEnum.swift
          grep -F 'RBx9RemoteDylibLibraryView' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'ipa-source/dylibs.json' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'SHA-256 checksum mismatch' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'Browse & Inject Source Dylibs' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'View Error Details' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'Copy Details' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'RBx9 Dark (Default)' feather/Feather/Views/Settings/App\ Icon/AppIconView.swift
          grep -F 'FEATHER_PROJECT_VERSION=1.3.23' feather/Feather.xcconfig
          test -f feather/Feather/Backend/Storage/RBx9InjectLog.swift
          grep -F 'RBx9InjectLogView()' feather/Feather/Views/Settings/SettingsView.swift
          test -f rbx9-signer/icon-original-before-dark-base64.txt
          test -f feather/Feather/Resources/Assets.xcassets/AppIcon.appiconset/rbx9.png
          grep -F '.swipeActions(edge: .trailing, allowsFullSwipe: true)' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'Label("Share / Export", systemImage: "square.and.arrow.up")' feather/Feather/Views/Signing/SigningTweaksView.swift
          ! grep -Fq 'RBx9StoredTweakExportButton' feather/Feather/Views/Signing/SigningTweaksView.swift
          ! grep -Fq '.swipeActions(edge: .leading' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'func rename(_ item: RBx9StoredTweak' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'ShareLink(item:' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'Button("Save")' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'RBx9DylibStorage' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'Developing and Modification' feather/Feather/Views/Settings/About/AboutView.swift
          ! grep -Fq 'rbx9ShowingStartup' feather/Feather/FeatherApp.swift
          ! grep -Fq '230_000_000' feather/Feather/FeatherApp.swift
          ! grep -Fq 'RBx9TransmissionStartup' feather/Feather/FeatherApp.swift
          ! grep -Fq 'image="Glyph"' "feather/Feather/Resources/Launch Screen.storyboard"
          grep -F 'image="RBx9LaunchIcon"' "feather/Feather/Resources/Launch Screen.storyboard"
          grep -F '<image name="RBx9LaunchIcon"' "feather/Feather/Resources/Launch Screen.storyboard"
          grep -F 'red="0.022" green="0.045" blue="0.085"' "feather/Feather/Resources/Launch Screen.storyboard"
          grep -F 'com.rbx9.signer.ipa' feather/Feather/Resources/Info.plist
          test -f feather/Feather/Resources/Assets.xcassets/RBx9LaunchIcon.imageset/rbx9-launch.png
          grep -F 'FEATHER_PRODUCT_BUNDLE_IDENTIFIER=com.rbx9.signer' feather/Feather.xcconfig
          grep -F 'Sign & Install' feather/Feather/Views/Signing/SigningView.swift
          ! grep -Fq 'Dylib Changes Ready' feather/Feather/Views/Signing/Shared/SigningDylibView.swift
          grep -F 'RBx9EditorActionBar' feather/Feather/Views/Signing/SigningTweaksView.swift
          grep -F 'opensInstallerOnTap' feather/Feather/Views/Library/LibraryCellView.swift
          grep -F 'selectedSigningAppPresenting = AnyApp(base: app)' feather/Feather/Views/Library/LibraryCellView.swift
          ! grep -Fq '.onTapGesture {' feather/Feather/Views/Library/LibraryCellView.swift
          grep -F 'Delete on Next Sign' feather/Feather/Views/Signing/Shared/SigningDylibView.swift
          grep -F 'Label("Import from Files", systemImage: "folder.badge.plus")' feather/Feather/Views/Library/LibraryView.swift
          grep -F 'Injecting Tweaks…' feather/Feather/Views/Signing/SigningView.swift
          grep -F 'Inject & Install' feather/Feather/Views/Signing/RBx9EditorActionBar.swift
          ! grep -Fq 'DisclosureGroup(.localized("Modify"))' feather/Feather/Views/Signing/SigningView.swift

      - name: Build unsigned app with Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          cd feather
          # Avoid an Xcode SwiftPM workspace crash caused by stale pin counts.
          rm -f Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          rm -f Feather.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild \
            -workspace Feather.xcworkspace \
            -scheme Feather \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/rbx9-build" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=NO \
            build > "$RUNNER_TEMP/rbx9-build.log" 2>&1 || {
              grep -E 'error:|fatal error:|BUILD FAILED' "$RUNNER_TEMP/rbx9-build.log" | tail -100 || true
              tail -80 "$RUNNER_TEMP/rbx9-build.log"
              exit 1
            }
          tail -15 "$RUNNER_TEMP/rbx9-build.log"

      - name: Package IPA for ESign/Feather signing
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/rbx9-build/Build/Products/Release-iphoneos/Feather.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/rbx9-package/Payload"
          # Xcode outputs a symlink in Build/Products when DEPLOYMENT_LOCATION=YES.
          # Dereference it; otherwise IPA contains only a symbolic link (a few hundred bytes).
          cp -RL "$APP" "$RUNNER_TEMP/rbx9-package/Payload/RBx9.app"
          test -f "$RUNNER_TEMP/rbx9-package/Payload/RBx9.app/Info.plist"
          (
            cd "$RUNNER_TEMP/rbx9-package"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/RBx9-v1.3.23-unsigned.ipa" Payload
          )
          # Guard against empty/invalid packages before uploading them.
          unzip -t "$GITHUB_WORKSPACE/RBx9-v1.3.23-unsigned.ipa" | tail -1
          unzip -l "$GITHUB_WORKSPACE/RBx9-v1.3.23-unsigned.ipa" | grep 'Payload/RBx9.app/Info.plist'
          test "$(stat -f%z "$GITHUB_WORKSPACE/RBx9-v1.3.23-unsigned.ipa")" -gt 1000000
          ls -lh "$GITHUB_WORKSPACE/RBx9-v1.3.23-unsigned.ipa"

      - name: Upload actual RBx9 IPA
        uses: actions/upload-artifact@v4
        with:
          name: RBx9-v1.3.23-iOS16plus-unsigned-IPA
          path: RBx9-v1.3.23-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log if unsuccessful
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RBx9-build-log
          path: ${{ runner.temp }}/rbx9-build.log
          if-no-files-found: ignore
