name: Publish Feather and ESign IPA Sources

on:
  release:
    types: [published, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'ipa-source/catalog.json'
      - 'ipa-source/scripts/repo_manager.py'
      - '.github/workflows/build-ipa-source.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing IPA release tag to import or re-import'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rbx9-ipa-source-index
  cancel-in-progress: false

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import IPA assets from release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_ACTION" == "deleted" ]]; then
            echo 'A release was deleted; skip import and prune old listings.'
            exit 0
          fi
          # Release assets added after initial publication do not fire a new
          # published event. When no tag was supplied (for example on push),
          # automatically import the most recent release containing an IPA.
          if [[ -z "$RELEASE_TAG" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
            RELEASE_TAG="$(jq -r '[.[] | select([.assets[].name] | any(endswith(".ipa")))][0].tag_name // empty' "$RUNNER_TEMP/releases.json")"
          fi
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No releases with .ipa assets found. Rebuilding existing metadata."
            exit 0
          fi
          echo "Importing IPA assets from release: $RELEASE_TAG"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          ipa_count="$(jq '[.assets[].name | select(endswith(".ipa"))] | length' "$RUNNER_TEMP/release.json")"
          if [[ "$ipa_count" -eq 0 ]]; then
            echo "::error::Release '$RELEASE_TAG' has no .ipa attached. Upload the .ipa, then rerun this workflow."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-ipas"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-ipas" --pattern '*.ipa'
          jq -r '.body // ""' "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-notes.txt"
          release_date="$(jq -r '.published_at // .created_at' "$RUNNER_TEMP/release.json")"
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/release-ipas/*.ipa)
          if (( ${#ipas[@]} == 0 )); then
            echo "No .ipa found; add an .ipa asset and rerun this workflow." >&2
            exit 1
          fi
          for ipa in "${ipas[@]}"; do
            filename="$(basename "$ipa")"
            url="$(jq -r --arg name "$filename" '.assets[] | select(.name==$name) | .browser_download_url' "$RUNNER_TEMP/release.json")"
            test -n "$url" && test "$url" != null
            python3 ipa-source/scripts/repo_manager.py add --ipa "$ipa" --url "$url" --date "$release_date" --notes-file "$RUNNER_TEMP/release-notes.txt"
          done
      - name: Prune removed or deleted release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add // []' > "$RUNNER_TEMP/all-releases.json"
          python3 ipa-source/scripts/repo_manager.py prune --releases-json "$RUNNER_TEMP/all-releases.json" --repository "$GITHUB_REPOSITORY"
      - name: Generate source files
        run: python3 ipa-source/scripts/repo_manager.py render
      - name: Commit updated IPA catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ipa-source/catalog.json ipa-source/source.json ipa-source/esign.json ipa/index.html esign/index.html
          if git diff --cached --quiet; then
            echo 'Source is already up to date'
            exit 0
          fi
          git commit -m 'Update Feather and ESign IPA catalogs'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo 'Could not push source after 5 attempts' >&2
          exit 1
