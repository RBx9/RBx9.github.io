name: Test Source Manager Dylib Catalog (unpublished)

on:
  push:
    branches: [feature/dylib-source-library-no-publish]
    paths:
      - 'source-manager/**'
      - '.github/workflows/test-dylib-source-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-rbx9-dylib-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate icon
        run: swift source-manager/scripts/create_icon.swift
      - name: Generate project
        run: cd source-manager && xcodegen generate
      - name: Build unsigned Source Manager preview
        run: |
          set -euo pipefail
          xcodebuild -project source-manager/RBx9SourceManager.xcodeproj \
            -scheme RBx9SourceManager -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/RBx9Preview" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package private preview IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/RBx9Preview/Build/Products/Release-iphoneos/RBx9SourceManager.app"
          test -f "$app/RBx9SourceManager"
          mkdir -p "$RUNNER_TEMP/rbx9-preview/Payload"
          cp -RL "$app" "$RUNNER_TEMP/rbx9-preview/Payload/"
          (cd "$RUNNER_TEMP/rbx9-preview" && zip -qry "$GITHUB_WORKSPACE/RBx9SourceManager-DylibLibrary-preview-unsigned.ipa" Payload)
          unzip -tq "$GITHUB_WORKSPACE/RBx9SourceManager-DylibLibrary-preview-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: RBx9-SourceManager-DylibLibrary-private-preview
          path: RBx9SourceManager-DylibLibrary-preview-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  export-source:
    if: contains(github.event.head_commit.message, '[export-sources]')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout private Signer development snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Retrieve Source Manager private development source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/RBx9-SourceManager
          git fetch --no-tags --depth=1 origin feature/dylib-source-library-no-publish
          MANAGER_SHA="$(git rev-parse FETCH_HEAD)"
          git archive "$MANAGER_SHA" source-manager .github/workflows/test-dylib-source-manager.yml | tar -x -C export/RBx9-SourceManager
          echo "$MANAGER_SHA" > export/RBx9-SourceManager/SOURCE_COMMIT.txt
          test -f export/RBx9-SourceManager/source-manager/App/RBx9SourceManagerApp.swift
          test -f export/RBx9-SourceManager/source-manager/App/RBx9DylibVault.swift

      - name: Retrieve private Signer 1.3.19 patch scripts and workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin fix/rbx9-signer-ready-recovery-layout-private-1-3-19
          mkdir -p signer-snapshot
          git archive FETCH_HEAD rbx9-signer .github/workflows/build-rbx9-signer.yml | tar -x -C signer-snapshot
          cp -R signer-snapshot/rbx9-signer .
          test -f rbx9-signer/upgrade_v1_3_19.py

      - name: Retrieve complete upstream Feather source including submodules
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/claration/feather.git feather
          mkdir -p export/RBx9-Signer
          git -C feather rev-parse HEAD > export/RBx9-Signer/FEATHER_BASE_COMMIT.txt
          git rev-parse FETCH_HEAD > export/RBx9-Signer/RBX9_SOURCE_COMMIT.txt

      - name: Generate RBx9 selected icon and optional appearance icons
        shell: bash
        run: |
          set -euo pipefail
          base64 -D -i rbx9-signer/icon-base64.txt -o rbx9-source-icon.jpg
          sips -s format png rbx9-source-icon.jpg --out rbx9-source-icon.png
          sips -z 1024 1024 rbx9-source-icon.png
          swift rbx9-signer/make_alternates.swift rbx9-source-icon.png rbx9-alt-icons
          test "$(find rbx9-alt-icons -type f -name '*.png' | wc -l | tr -d ' ')" = 12

      - name: Apply every RBx9 Signer source modification up to 1.3.19
        shell: bash
        run: |
          set -euo pipefail
          python3 rbx9-signer/bootstrap.py
          python3 rbx9-signer/upgrade_v1_1.py
          python3 rbx9-signer/upgrade_icons_appearance.py
          python3 rbx9-signer/upgrade_v1_2.py
          python3 rbx9-signer/hotfix_v1_2_1.py
          python3 rbx9-signer/upgrade_v1_3.py
          python3 rbx9-signer/upgrade_v1_3_1.py
          python3 rbx9-signer/upgrade_v1_3_2.py
          python3 rbx9-signer/upgrade_v1_3_3.py
          python3 rbx9-signer/upgrade_v1_3_4.py
          python3 rbx9-signer/upgrade_v1_3_5.py
          python3 rbx9-signer/upgrade_v1_3_6.py
          python3 rbx9-signer/upgrade_v1_3_7.py
          python3 rbx9-signer/upgrade_v1_3_8.py
          python3 rbx9-signer/upgrade_v1_3_9.py
          python3 rbx9-signer/upgrade_v1_3_10.py
          python3 rbx9-signer/upgrade_v1_3_11.py
          python3 rbx9-signer/upgrade_v1_3_12.py
          python3 rbx9-signer/upgrade_v1_3_13.py
          python3 rbx9-signer/upgrade_v1_3_14.py
          python3 rbx9-signer/upgrade_v1_3_15.py
          python3 rbx9-signer/upgrade_v1_3_16.py
          python3 rbx9-signer/upgrade_v1_3_17.py
          python3 rbx9-signer/upgrade_v1_3_18.py
          python3 rbx9-signer/upgrade_v1_3_19.py
          grep -F 'FEATHER_PROJECT_VERSION=1.3.19' feather/Feather.xcconfig
          grep -F 'rbx9RecoveryCard' feather/Feather/Views/Library/Install/InstallPreviewView.swift
          grep -F 'confirmedDeletionAfterDismiss' feather/Feather/Views/Signing/SigningTweaksView.swift
          test -f feather/LICENSE

      - name: Assemble complete, buildable source trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/RBx9-Signer/Build-Patches export/RBx9-Signer/Patched-Feather
          rsync -a --exclude='.git' feather/ export/RBx9-Signer/Patched-Feather/
          rsync -a rbx9-signer/ export/RBx9-Signer/Build-Patches/
          cp signer-snapshot/.github/workflows/build-rbx9-signer.yml export/RBx9-Signer/build-rbx9-signer-private.yml
          test -f export/RBx9-Signer/Patched-Feather/Feather.xcodeproj/project.pbxproj
          test -f export/RBx9-Signer/Patched-Feather/Feather/Views/Library/Install/InstallPreviewView.swift
          test -f export/RBx9-Signer/Build-Patches/upgrade_v1_3_19.py
          command -v xcodegen >/dev/null || brew install xcodegen
          (cd export/RBx9-SourceManager && swift source-manager/scripts/create_icon.swift)
          (
            cd export/RBx9-SourceManager/source-manager
            xcodegen generate
          )
          test -f export/RBx9-SourceManager/source-manager/RBx9SourceManager.xcodeproj/project.pbxproj
          test -f export/RBx9-SourceManager/source-manager/App/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Package all source code without credentials or release publishing
        shell: bash
        run: |
          set -euo pipefail
          test ! -e export/RBx9-Signer/Patched-Feather/.git
          find export -type f | sort > SOURCE_FILE_LIST.txt
          printf '%s\n' 'SOURCE: RBx9 Signer v1.3.19 private with patched Feather source, all build patch scripts, and original GPL-3.0 license.' > EXPORT_NOTES.txt
          printf '%s\n' 'SOURCE: Source Manager latest unpublished Dylib Library preview with storage deletion fix and generated Xcode project.' >> EXPORT_NOTES.txt
          printf '%s\n' 'These are sources, not signed IPAs. No public releases or live catalog updates are made.' >> EXPORT_NOTES.txt
          zip -qry RBx9-Both-Apps-Complete-Source.zip export SOURCE_FILE_LIST.txt EXPORT_NOTES.txt
          unzip -tq RBx9-Both-Apps-Complete-Source.zip
          ls -lh RBx9-Both-Apps-Complete-Source.zip

      - name: Upload source-only bundle as private-test workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RBx9-Both-Apps-Complete-Source
          path: RBx9-Both-Apps-Complete-Source.zip
          retention-days: 14
          if-no-files-found: error
