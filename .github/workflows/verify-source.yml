name: Verify live Sileo source

on:
  push:
    paths:
      - '.github/workflows/verify-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Sileo source files and indexed .deb packages
        shell: bash
        run: |
          set -euo pipefail
          base='https://rbx9.github.io'
          for path in Release Packages Packages.gz; do
            echo "::group::Checking $base/$path"
            curl -fLSs --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 90 "$base/$path" -o "/tmp/$(basename "$path")"
            echo "::endgroup::"
          done
          grep -qx 'Components: main' /tmp/Release
          grep -qx 'Origin: RBx9' /tmp/Release
          gzip -t /tmp/Packages.gz
          diff -u /tmp/Packages <(gzip -dc /tmp/Packages.gz)
          grep -q '^Package: local.duobar' /tmp/Packages

          # Read real filenames and SHA256 hashes from the current APT index.
          # This prevents false failures after DuoBar receives an update.
          awk '
            /^Filename: / {file=$2}
            /^SHA256: / {
              if (file != "") {
                print file, $2
                file=""
              }
            }
          ' /tmp/Packages > /tmp/indexed-debs
          test -s /tmp/indexed-debs

          while read -r filename checksum; do
            [[ "$filename" == debs/*.deb ]] || { echo "Unexpected path: $filename" >&2; exit 1; }
            [[ "$checksum" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Invalid sha256: $filename" >&2; exit 1; }
            echo "::group::Checking $base/$filename"
            curl -fLSs --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 90 "$base/$filename" -o /tmp/check.deb
            echo "$checksum  /tmp/check.deb" | sha256sum --check
            echo "::endgroup::"
          done < /tmp/indexed-debs
