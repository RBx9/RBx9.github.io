# XcodeGen spec. Run `xcodegen generate` to create RBx9PDF.xcodeproj.
name: RBx9PDF
options:
  bundleIdPrefix: com.rbx9
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
targets:
  RBx9PDF:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # Same compression and Word engines as the web app.
      - path: ../../pdf/compress.js
        buildPhase: resources
      - path: ../../pdf/docx.js
        buildPhase: resources
    info:
      # Generated by XcodeGen and merged with Xcode's generated keys. Lets other
      # apps share PDFs and images to RBx9 PDF ("Open in…").
      path: Support/Info.plist
      properties:
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
    settings:
      base:
        PRODUCT_NAME: RBx9PDF
        PRODUCT_BUNDLE_IDENTIFIER: com.rbx9.pdf
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RBx9 PDF
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSCameraUsageDescription: RBx9 PDF uses the camera to scan paper documents into PDFs.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
